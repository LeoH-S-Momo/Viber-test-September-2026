# Ambiente de desenvolvimento local do SeaPass.
# Sobe apenas a infraestrutura (banco, cache, SMTP de teste); api e web rodam via `pnpm dev`
# (turbo) fora de container para manter hot-reload rápido. Uso:
# `docker compose -f infra/docker-compose.yml up -d`
#
# Variaveis lidas do arquivo `.env` na raiz do monorepo (ver `.env.example`).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ../.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ../.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP de mentira para inspecionar as notificacoes por e-mail em dev (ver
  # docs/architecture/decisions/0019-events-and-notifications.md) — sem persistencia (a caixa de
  # entrada vive em memoria), por isso sem volume: perder o container so limpa o que ja foi lido.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"
