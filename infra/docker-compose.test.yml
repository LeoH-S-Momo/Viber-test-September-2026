# Infraestrutura efemera para testes de integracao (CI e local).
# Uso: `docker compose -f infra/docker-compose.test.yml up -d` antes de `pnpm test:integration`.
# Portas diferentes do docker-compose.yml de dev para poder rodar os dois em paralelo.

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seapass_test
      POSTGRES_PASSWORD: seapass_test
      POSTGRES_DB: seapass_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seapass_test -d seapass_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  # SMTP de mentira pra teste de integracao das notificacoes (ver
  # docs/architecture/decisions/0019-events-and-notifications.md) — mesma ideia do MailHog usado
  # em dev (apps/api/.claude/skills/seapass-local-infra/SKILL.md), so que via imagem Docker aqui
  # (CI tem Docker; a maquina de dev deste projeto nao tem, por isso o binario portatil la).
  mailhog-test:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1026:1025" # SMTP
      - "8026:8025" # API/UI web
