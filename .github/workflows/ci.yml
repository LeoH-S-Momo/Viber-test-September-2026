name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PNPM_VERSION: 9.12.0

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --coverage

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    # Portas e credenciais aqui devem bater com infra/docker-compose.test.yml, nao com
    # apps/api/.env.example (que aponta para os servicos de DEV, em portas diferentes).
    env:
      DATABASE_URL: postgresql://seapass_test:seapass_test@localhost:5433/seapass_test?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: ci-integration-access-secret-32-chars-min
      JWT_REFRESH_SECRET: ci-integration-refresh-secret-32-chars-min
      SMTP_HOST: localhost
      SMTP_PORT: "1026"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Start test infra
        run: docker compose -f infra/docker-compose.test.yml up -d --wait
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - name: Stop test infra
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down -v

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    # A API roda de verdade aqui (background, `dist/main.js` depois de `pnpm build`) — os
    # testes e2e de fluxo critico (login, checkout/pagamento, check-in) precisam de dados
    # reais vindos do Postgres via API, nao so do bundle estatico do `web`. Credenciais e
    # portas batem com `infra/docker-compose.yml` (dev), nao com o `docker-compose.test.yml`
    # (portas deslocadas) usado pelo job `integration-tests`.
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3333
      POSTGRES_USER: seapass
      POSTGRES_PASSWORD: seapass
      POSTGRES_DB: seapass
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
      MAILHOG_SMTP_PORT: "1025"
      MAILHOG_UI_PORT: "8025"
      DATABASE_URL: postgresql://seapass:seapass@localhost:5432/seapass?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-e2e-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-min-32-chars-long
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      WEB_APP_URL: http://localhost:3000
      PORT: "3333"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start infra (postgres, redis, mailhog)
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - name: Start API in background
        run: nohup node apps/api/dist/main.js > api.log 2>&1 &
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3333/health > /dev/null; then
              echo "API up"; exit 0
            fi
            sleep 1
          done
          echo "API never became healthy — dumping log:"; cat api.log; exit 1
      - run: pnpm test:e2e
      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # Roda em toda PR (nao so em push pra main) — uma imagem que builda mas nao sobe (CMD errado,
  # arquivo de runtime faltando) so seria descoberta depois de mergear, sem isto.
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f infra/docker/api.Dockerfile -t seapass-api:${{ github.sha }} .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t seapass-web:${{ github.sha }} .
      # Smoke test — so confirma que o container SOBE e responde HTTP (nao builda e crasha no
      # boot). Nao espera 200 (a api sem Postgres/Redis reais reporta 503 em /health de proposito,
      # ver AllExceptionsFilter/HealthController) — so que o processo nao morreu, o que
      # integration-tests/e2e-tests ja cobrem com a infra de verdade.
      - name: Smoke test api image (container boots and serves HTTP)
        run: |
          docker run -d --name seapass-api-smoke -p 3333:3333 \
            -e DATABASE_URL=postgresql://x:x@localhost:5432/x \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_ACCESS_SECRET=smoke-test-access-secret-32-chars-min \
            -e JWT_REFRESH_SECRET=smoke-test-refresh-secret-32-chars-min \
            seapass-api:${{ github.sha }}
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3333/health || echo "000")
            if [ "$code" != "000" ]; then echo "api respondeu HTTP $code"; exit 0; fi
            sleep 1
          done
          echo "api nunca respondeu — dumping logs:"; docker logs seapass-api-smoke; exit 1
      - name: Stop api smoke container
        if: always()
        run: docker rm -f seapass-api-smoke
