name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PNPM_VERSION: 9.12.0

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --coverage

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    # Portas e credenciais aqui devem bater com infra/docker-compose.test.yml, nao com
    # apps/api/.env.example (que aponta para os servicos de DEV, em portas diferentes).
    env:
      DATABASE_URL: postgresql://seapass_test:seapass_test@localhost:5433/seapass_test?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Start test infra
        run: docker compose -f infra/docker-compose.test.yml up -d --wait
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - name: Stop test infra
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down -v

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    # NEXT_PUBLIC_API_URL so afeta o que fica embutido no bundle do client (nao precisa da
    # API rodando aqui: este job so builda e sobe o `web`, ainda nao inicia a `api` — os
    # testes e2e atuais nao dependem dela). Quando um teste e2e passar a depender da API
    # de verdade, este job precisa ganhar um passo para subir `node apps/api/dist/main.js`
    # (com DATABASE_URL/REDIS_URL/JWT_* apontando para os servicos abaixo) antes do build.
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - name: Start infra (postgres, redis, minio)
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f infra/docker/api.Dockerfile -t seapass-api:${{ github.sha }} .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t seapass-web:${{ github.sha }} .
